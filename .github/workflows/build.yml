name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Configure (x86 release)
        run: xmake f -a x86 -m release -y

      - name: Build
        run: xmake build

      - name: Rename artifact with commit hash
        run: |
          $hash = git rev-parse --short HEAD
          Copy-Item build/windows/x86/release/showin.exe "showin-$hash.exe"
          echo "ARTIFACT=showin-$hash.exe" >> $env:GITHUB_ENV

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: ${{ env.ARTIFACT }}
